name: Keep Streamlit Alive

on:
  schedule:
    # 6시간마다 실행 (UTC 00:00, 06:00, 12:00, 18:00 -> KST 09:00, 15:00, 21:00, 03:00)
    - cron: '0 */6 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          echo "Pinging Streamlit App..."
          python -c "
          import urllib.request
          req = urllib.request.Request(
              'https://juso-ai-docent.streamlit.app/',
              headers={'User-Agent': 'Mozilla/5.0'}
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  print(f'Success! Status code: {res.getcode()}')
          except Exception as e:
              print(f'Ping executed with result: {e}')
          "

