name: Keep Streamlit Alive

on:
  schedule:
    # 30분마다 자동 접속 (UTC 기준) -> Streamlit Cloud 수면 방지
    - cron: '*/30 * * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wakeup & Keep Alive Streamlit App
        run: |
          python -c "
          import urllib.request
          import time
          
          url = 'https://juso-ai-docent.streamlit.app/?ping=' + str(int(time.time()))
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8',
              'Accept-Language': 'ko-KR,ko;q=0.9,en-US;q=0.8,en;q=0.7'
          }
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  print(f'✅ Wakeup Success! HTTP Status: {res.getcode()}')
          except Exception as e:
              print(f'⚠️ Wakeup Ping Result: {e}')
          "

